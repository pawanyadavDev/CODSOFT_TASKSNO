<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Player</title>
<link rel="icon" type="image/png" href="assets/images/Favicon.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body data-bs-theme="dark">
<div class="container-xl py-3">
  <header class="row g-2 align-items-center mb-4">
    <div class="col-6 col-md-3"><a class="brand" href="#"><i class="bi bi-music-note-beamed"></i> Music Player</a></div>
    <div class="col-12 col-md-6 order-3 order-md-2">
      <div class="glass search"><i class="bi bi-search"></i><input id="search" type="search" placeholder="Search songs, artists..." aria-label="Search songs"></div>
    </div>
    <div class="col-6 col-md-3 order-2 order-md-3 text-end">
      <button class="btn-icon" id="hdrFav" aria-label="Show favorites"><i class="bi bi-heart-fill"></i></button>
      <button class="btn-icon" id="hdrList" aria-label="Show playlist"><i class="bi bi-music-note-list"></i></button>
    </div>
  </header>

  <div id="alert" class="alert alert-danger d-none" role="alert"></div>

  <main class="row g-4">
    <section class="col-lg-5" aria-label="Now playing">
      <div class="glass p-4 text-center">
        <img id="art" class="art" src="" alt="Album artwork">
        <h1 class="h4 mt-4 mb-1" id="title">—</h1>
        <p class="mb-0 text-secondary" id="artist"></p>
        <small class="text-secondary" id="album"></small>
        <div class="mt-3">
          <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
          <div class="d-flex justify-content-between small text-secondary"><span id="current">00:00</span><span id="duration">00:00</span></div>
        </div>
        <div class="controls">
          <button class="btn-icon" id="shuffle" aria-label="Shuffle"><i class="bi bi-shuffle"></i></button>
          <button class="btn-icon lg" id="prev" aria-label="Previous song"><i class="bi bi-skip-start-fill"></i></button>
          <button class="play" id="play" aria-label="Play song"><i class="bi bi-play-fill"></i></button>
          <button class="btn-icon lg" id="next" aria-label="Next song"><i class="bi bi-skip-end-fill"></i></button>
          <button class="btn-icon" id="repeat" aria-label="Repeat off"><i class="bi bi-repeat"></i></button>
        </div>
        <div class="d-flex align-items-center justify-content-between gap-3 mt-3">
          <button class="btn-icon" id="fav" aria-label="Add to favorites"><i class="bi bi-heart"></i></button>
          <button class="pill" id="autoplay" aria-pressed="true">Autoplay on</button>
        </div>
        <div class="d-flex align-items-center gap-1 mt-3" role="group" aria-label="Volume">
          <button class="btn-icon" id="mute" aria-label="Mute"><i class="bi bi-volume-up-fill"></i></button>
          <button class="btn-icon" id="volDown" aria-label="Volume down" title="Volume down"><i class="bi bi-dash-lg"></i></button>
          <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
          <button class="btn-icon" id="volUp" aria-label="Volume up" title="Volume up"><i class="bi bi-plus-lg"></i></button>
          <span id="volPct" class="small text-secondary text-end" style="width:42px">80%</span>
        </div>
      </div>
    </section>

    <section class="col-lg-7" aria-label="Song lists">
      <div class="glass p-3">
        <div class="tabs" role="tablist" id="tabs">
          <button data-tab="playlist" class="active">Playlist</button>
          <button data-tab="queue">Queue</button>
          <button data-tab="favorites">Favorites</button>
          <button data-tab="recent">Recently played</button>
        </div>
        <ul class="list-unstyled m-0" id="list"></ul>
      </div>
    </section>
  </main>
  <div>

    <section class="footer-mark">
      <div class="glass p-3">
        <p> © <span id="year" style="text-align: center;">  </span>2026</span> Pawan Yadav. All rights reserved.</p>
      </div>
    </section>
  </main>
   
  </div>
    
</div>
<audio id="audio" preload="metadata"></audio>
<script src="script.js"></script>
</body>
</html>
