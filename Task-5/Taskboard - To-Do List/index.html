<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskboard - To-Do List</title>
  <link rel="icon" type="image/png" href="Favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>Taskboard - To-Do List</h1>
        <p class="date" id="todayLabel"></p>
      </div>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Switch to dark mode" title="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <main class="layout">
      <aside class="side">
        <section class="card stats" aria-label="Task summary">
          <div class="stat-row">
            <div class="stat">
              <span class="stat-num" id="statTotal">0</span>
              <span class="stat-label">Total</span>
            </div>
            <div class="stat">
              <span class="stat-num" id="statPending">0</span>
              <span class="stat-label">Pending</span>
            </div>
            <div class="stat">
              <span class="stat-num done" id="statDone">0</span>
              <span class="stat-label">Completed</span>
            </div>
          </div>
          <div class="progress" role="progressbar" aria-label="Completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <p class="progress-text" id="progressText">No tasks yet</p>
        </section>

        <section class="card" aria-labelledby="formTitle">
          <h2 id="formTitle">New task</h2>
          <form id="taskForm" novalidate>
            <div class="field">
              <label for="title">Task</label>
              <input type="text" id="title" maxlength="100" placeholder="What needs to get done?" autocomplete="off" aria-describedby="titleError">
              <p class="error" id="titleError" role="alert"></p>
            </div>

            <div class="grid-2">
              <div class="field">
                <label for="category">Category</label>
                <select id="category">
                  <option>Personal</option>
                  <option>Work</option>
                  <option>Study</option>
                  <option>Health</option>
                  <option>Shopping</option>
                  <option>Other</option>
                </select>
              </div>
              <div class="field">
                <label for="priority">Priority</label>
                <select id="priority">
                  <option value="low">Low</option>
                  <option value="medium" selected>Medium</option>
                  <option value="high">High</option>
                </select>
              </div>
            </div>

            <div class="field">
              <label for="due">Due date <span class="optional">(optional)</span></label>
              <input type="date" id="due" aria-describedby="dueError">
              <p class="error" id="dueError" role="alert"></p>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn primary" id="submitBtn">Add task</button>
              <button type="button" class="btn ghost" id="cancelBtn" hidden>Cancel</button>
            </div>
          </form>
        </section>
      </aside>

      <section class="main-col" aria-label="Your tasks">
        <div class="toolbar">
          <div class="search">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" id="search" placeholder="Search tasks" aria-label="Search tasks">
          </div>

          <div class="tabs" role="group" aria-label="Filter by status">
            <button type="button" class="tab active" data-status="all" aria-pressed="true">All</button>
            <button type="button" class="tab" data-status="pending" aria-pressed="false">Pending</button>
            <button type="button" class="tab" data-status="completed" aria-pressed="false">Completed</button>
          </div>

          <div class="filters">
            <select id="filterCategory" aria-label="Filter by category">
              <option value="all">All categories</option>
              <option>Personal</option>
              <option>Work</option>
              <option>Study</option>
              <option>Health</option>
              <option>Shopping</option>
              <option>Other</option>
            </select>
            <select id="filterPriority" aria-label="Filter by priority">
              <option value="all">All priorities</option>
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
            <select id="sortBy" aria-label="Sort tasks">
              <option value="created">Newest first</option>
              <option value="due">Due date</option>
              <option value="priority">Priority</option>
              <option value="title">A to Z</option>
            </select>
          </div>
        </div>

        <ul class="task-list" id="taskList"></ul>

        <div class="empty" id="emptyState" hidden>
          <p class="empty-title" id="emptyTitle"></p>
          <p class="empty-text" id="emptyText"></p>
        </div>

        <div class="list-footer" id="listFooter" hidden>
          <span id="resultCount"></span>
          <button type="button" class="link-btn" id="clearDone">Clear completed</button>
        </div>
      </section>
    </main>
  </div>
  
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="footer"> <p> © <span id="year" style="text-align: center;">  </span>2026</span> Pawan Yadav. All rights reserved.</p></div>

</body>
</html>
